<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Create your Voyage account and start your journey today.">
    <title>Voyage — Create Account</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

    <!-- Background -->
    <div class="page-bg">
        <img src="{{ url_for('static', filename='images/bg_register.jpg') }}" alt="Lake with mountain reflections">
    </div>

    <!-- Auth Container -->
    <div class="auth-container">
        <div class="auth-card">

            <!-- Branding -->
            <h1 class="brand-title">Voyage</h1>
            <h2 class="auth-heading">Create Your Account</h2>

            <!-- Flash Messages -->
            {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
            <div class="flash-messages">
                {% for category, message in messages %}
                <div class="flash-message {{ category }}">
                    <span>{{ message }}</span>
                    <button class="flash-close" aria-label="Close">&times;</button>
                </div>
                {% endfor %}
            </div>
            {% endif %}
            {% endwith %}

            <!-- Register Form -->
            <form id="registerForm" method="POST" action="{{ url_for('register') }}" novalidate>

                <!-- Full Name -->
                <div class="form-group">
                    <div class="input-wrapper">
                        <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/>
                            <circle cx="12" cy="7" r="4"/>
                        </svg>
                        <input type="text" id="full_name" name="full_name" class="form-input" placeholder="Full Name" autocomplete="name" required>
                    </div>
                </div>

                <!-- Email -->
                <div class="form-group">
                    <div class="input-wrapper">
                        <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="2" y="4" width="20" height="16" rx="2"/>
                            <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
                        </svg>
                        <input type="email" id="email" name="email" class="form-input" placeholder="Email" autocomplete="email" required>
                    </div>
                </div>

                <!-- Password & Confirm Password Row -->
                <div class="form-row">
                    <div class="form-group">
                        <div class="input-wrapper">
                            <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <rect width="18" height="11" x="3" y="11" rx="2" ry="2"/>
                                <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                            </svg>
                            <input type="password" id="password" name="password" class="form-input" placeholder="Password" autocomplete="new-password" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <div class="input-wrapper">
                            <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <rect width="18" height="11" x="3" y="11" rx="2" ry="2"/>
                                <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                            </svg>
                            <input type="password" id="confirm_password" name="confirm_password" class="form-input" placeholder="Confirm Passw" autocomplete="new-password" required>
                        </div>
                    </div>
                </div>

                <!-- Country & Phone Row -->
                <div class="form-row">
                    <div class="form-group">
                        <div class="input-wrapper">
                            <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <circle cx="12" cy="12" r="10"/>
                                <path d="M2 12h20"/>
                                <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
                            </svg>
                            <select id="country" name="country" class="form-select">
                                <option value="" disabled selected>Country</option>
                                <option value="AF">🇦🇫 Afghanistan</option>
                                <option value="AL">🇦🇱 Albania</option>
                                <option value="DZ">🇩🇿 Algeria</option>
                                <option value="AR">🇦🇷 Argentina</option>
                                <option value="AU">🇦🇺 Australia</option>
                                <option value="AT">🇦🇹 Austria</option>
                                <option value="BD">🇧🇩 Bangladesh</option>
                                <option value="BE">🇧🇪 Belgium</option>
                                <option value="BR">🇧🇷 Brazil</option>
                                <option value="CA">🇨🇦 Canada</option>
                                <option value="CL">🇨🇱 Chile</option>
                                <option value="CN">🇨🇳 China</option>
                                <option value="CO">🇨🇴 Colombia</option>
                                <option value="CZ">🇨🇿 Czech Republic</option>
                                <option value="DK">🇩🇰 Denmark</option>
                                <option value="EG">🇪🇬 Egypt</option>
                                <option value="FI">🇫🇮 Finland</option>
                                <option value="FR">🇫🇷 France</option>
                                <option value="DE">🇩🇪 Germany</option>
                                <option value="GR">🇬🇷 Greece</option>
                                <option value="HK">🇭🇰 Hong Kong</option>
                                <option value="HU">🇭🇺 Hungary</option>
                                <option value="IN">🇮🇳 India</option>
                                <option value="ID">🇮🇩 Indonesia</option>
                                <option value="IR">🇮🇷 Iran</option>
                                <option value="IQ">🇮🇶 Iraq</option>
                                <option value="IE">🇮🇪 Ireland</option>
                                <option value="IL">🇮🇱 Israel</option>
                                <option value="IT">🇮🇹 Italy</option>
                                <option value="JP">🇯🇵 Japan</option>
                                <option value="KE">🇰🇪 Kenya</option>
                                <option value="KR">🇰🇷 South Korea</option>
                                <option value="MY">🇲🇾 Malaysia</option>
                                <option value="MX">🇲🇽 Mexico</option>
                                <option value="NL">🇳🇱 Netherlands</option>
                                <option value="NZ">🇳🇿 New Zealand</option>
                                <option value="NG">🇳🇬 Nigeria</option>
                                <option value="NO">🇳🇴 Norway</option>
                                <option value="PK">🇵🇰 Pakistan</option>
                                <option value="PE">🇵🇪 Peru</option>
                                <option value="PH">🇵🇭 Philippines</option>
                                <option value="PL">🇵🇱 Poland</option>
                                <option value="PT">🇵🇹 Portugal</option>
                                <option value="RO">🇷🇴 Romania</option>
                                <option value="RU">🇷🇺 Russia</option>
                                <option value="SA">🇸🇦 Saudi Arabia</option>
                                <option value="SG">🇸🇬 Singapore</option>
                                <option value="ZA">🇿🇦 South Africa</option>
                                <option value="ES">🇪🇸 Spain</option>
                                <option value="LK">🇱🇰 Sri Lanka</option>
                                <option value="SE">🇸🇪 Sweden</option>
                                <option value="CH">🇨🇭 Switzerland</option>
                                <option value="TW">🇹🇼 Taiwan</option>
                                <option value="TH">🇹🇭 Thailand</option>
                                <option value="TR">🇹🇷 Turkey</option>
                                <option value="UA">🇺🇦 Ukraine</option>
                                <option value="AE">🇦🇪 UAE</option>
                                <option value="GB">🇬🇧 United Kingdom</option>
                                <option value="US">🇺🇸 United States</option>
                                <option value="VN">🇻🇳 Vietnam</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-group">
                        <div class="input-wrapper">
                            <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/>
                            </svg>
                            <input type="tel" id="phone" name="phone" class="form-input" placeholder="Phone Number" autocomplete="tel">
                        </div>
                    </div>
                </div>

                <!-- Agree to Terms -->
                <div class="terms-row">
                    <div class="checkbox-wrapper">
                        <input type="checkbox" id="agree_terms" name="agree_terms" value="1">
                        <label for="agree_terms">Agree to <a href="#" onclick="event.preventDefault();">Terms</a></label>
                    </div>
                </div>

                <!-- Register Button -->
                <button type="submit" class="btn-primary" id="registerBtn">Register</button>
            </form>

            <!-- Social Register -->
            <div class="social-buttons" style="margin-top: 0.85rem;">
                <button type="button" class="btn-social" id="googleBtn">
                    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" fill="#4285F4"/>
                        <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                        <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
                        <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
                    </svg>
                    Register with Google
                </button>
                <button type="button" class="btn-social" id="facebookBtn">
                    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z" fill="#1877F2"/>
                    </svg>
                    Register with Facebook
                </button>
            </div>

            <!-- Footer Link -->
            <div class="auth-footer">
                Already have an account? <a href="{{ url_for('login') }}">Login</a>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
