<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Reset your Voyage account password.">
    <title>Voyage — Forgot Password</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

    <!-- Background -->
    <div class="page-bg">
        <img src="{{ url_for('static', filename='images/bg_forgot.jpg') }}" alt="Coastal modern house at twilight">
    </div>

    <!-- Auth Container -->
    <div class="auth-container">
        <div class="auth-card">

            <!-- Branding -->
            <h1 class="brand-title">Voyage</h1>

            <!-- Forgot Password Icon -->
            <div class="forgot-icon">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="2" y="4" width="20" height="16" rx="2"/>
                    <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
                    <circle cx="18" cy="16" r="3"/>
                    <path d="M18 14.5v1.5"/>
                    <circle cx="18" cy="17.5" r="0.25" fill="currentColor"/>
                </svg>
            </div>

            <h2 class="auth-heading">Forgot Password?</h2>

            <!-- Flash Messages -->
            {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
            <div class="flash-messages">
                {% for category, message in messages %}
                <div class="flash-message {{ category }}">
                    <span>{{ message }}</span>
                    <button class="flash-close" aria-label="Close">&times;</button>
                </div>
                {% endfor %}
            </div>
            {% endif %}
            {% endwith %}

            <!-- Forgot Password Form -->
            <form id="forgotForm" method="POST" action="{{ url_for('forgot_password') }}" novalidate>

                <!-- Email -->
                <div class="form-group">
                    <div class="input-wrapper">
                        <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="2" y="4" width="20" height="16" rx="2"/>
                            <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
                        </svg>
                        <input type="email" id="email" name="email" class="form-input" placeholder="Email" autocomplete="email" required>
                    </div>
                </div>

                <!-- Send Reset Link Button -->
                <button type="submit" class="btn-primary" id="resetBtn" style="margin-top: 0.5rem;">Send Reset Link</button>
            </form>

            <!-- Back to Login -->
            <div class="auth-footer" style="margin-top: 1.25rem;">
                <a href="{{ url_for('login') }}">Back to Login</a>
            </div>

            <!-- Don't have an account -->
            <div class="auth-footer" style="margin-top: 0.75rem;">
                Don't have an account? <a href="{{ url_for('register') }}">Register</a>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
