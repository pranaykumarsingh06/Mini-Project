<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login — VOYAGE</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', sans-serif;
            background: #F8FAFC;
            color: #0F172A;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-card {
            background: white;
            border-radius: 24px;
            width: 100%;
            max-width: 420px;
            padding: 2.5rem;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.06);
            border: 1px solid #E2E8F0;
            text-align: center;
        }

        .brand-icon {
            width: 60px;
            height: 60px;
            border-radius: 18px;
            background: #EFF6FF;
            color: #2563EB;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            margin: 0 auto 1.25rem auto;
        }

        h1 {
            font-size: 1.4rem;
            font-weight: 800;
            margin-bottom: 6px;
        }

        p {
            color: #64748B;
            font-size: 0.88rem;
            margin-bottom: 1.75rem;
        }

        .field {
            text-align: left;
            margin-bottom: 1.2rem;
        }

        .field label {
            display: block;
            font-size: 0.82rem;
            font-weight: 600;
            color: #475569;
            margin-bottom: 6px;
        }

        .field input {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 1.5px solid #CBD5E1;
            border-radius: 12px;
            font-family: inherit;
            font-size: 0.95rem;
            outline: none;
            transition: all 0.2s;
        }

        .field input:focus {
            border-color: #2563EB;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }

        .btn-submit {
            width: 100%;
            padding: 0.85rem;
            background: #2563EB;
            color: white;
            border: none;
            border-radius: 12px;
            font-family: inherit;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 0.5rem;
        }

        .btn-submit:hover {
            background: #1D4ED8;
        }

        .flash-box {
            padding: 0.85rem;
            border-radius: 10px;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 1.25rem;
            text-align: left;
        }
        .flash-err { background: #FEE2E2; color: #991B1B; }
        .flash-succ { background: #DCFCE7; color: #166534; }

        .back-link {
            margin-top: 1.5rem;
        }
        .back-link a {
            color: #64748B;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 600;
        }
        .back-link a:hover { color: #0F172A; }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="brand-icon">✈️</div>
        <h1>Admin Control Portal</h1>
        <p>Enter your admin credentials to log in</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="flash-box {% if category == 'error' %}flash-err{% else %}flash-succ{% endif %}">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form action="{{ url_for('admin_login') }}" method="POST">
            <div class="field">
                <label for="email">Admin Email</label>
                <input type="email" id="email" name="email" value="pranaykrsingh03@gmail.com" required>
            </div>

            <div class="field">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="••••••••" required autofocus>
            </div>

            <button type="submit" class="btn-submit">
                Log In to Admin Panel
            </button>
        </form>

        <div class="back-link">
            <a href="{{ url_for('dashboard') }}">← Back to Voyage Website</a>
        </div>
    </div>

</body>
</html>
