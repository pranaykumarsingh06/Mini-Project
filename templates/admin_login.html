<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Portal Login — VOYAGE</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            background: #0F172A;
            color: #F8FAFC;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-image: radial-gradient(circle at 50% 30%, #1E293B 0%, #0F172A 70%);
        }

        .admin-login-card {
            background: rgba(30, 41, 59, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid #334155;
            border-radius: 20px;
            width: 100%;
            max-width: 440px;
            padding: 2.5rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .admin-brand-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .admin-icon-shield {
            width: 60px;
            height: 60px;
            border-radius: 16px;
            background: linear-gradient(135deg, #2563EB, #1D4ED8);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            margin-bottom: 1rem;
            box-shadow: 0 10px 20px rgba(37, 99, 235, 0.3);
        }

        .admin-brand-header h1 {
            font-size: 1.5rem;
            font-weight: 800;
            margin: 0 0 6px 0;
            letter-spacing: -0.5px;
        }

        .admin-brand-header p {
            font-size: 0.85rem;
            color: #94A3B8;
            margin: 0;
        }

        .form-group-admin {
            margin-bottom: 1.25rem;
        }

        .form-group-admin label {
            display: block;
            font-size: 0.82rem;
            font-weight: 600;
            color: #CBD5E1;
            margin-bottom: 6px;
        }

        .form-input-admin {
            width: 100%;
            padding: 0.75rem 1rem;
            background: #0F172A;
            border: 1.5px solid #334155;
            border-radius: 10px;
            color: white;
            font-family: inherit;
            font-size: 0.95rem;
            box-sizing: border-box;
            outline: none;
            transition: all 0.2s;
        }

        .form-input-admin:focus {
            border-color: #2563EB;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.2);
        }

        .btn-admin-submit {
            width: 100%;
            padding: 0.85rem;
            background: linear-gradient(135deg, #2563EB, #1D4ED8);
            color: white;
            border: none;
            border-radius: 10px;
            font-family: inherit;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 0.5rem;
        }

        .btn-admin-submit:hover {
            transform: translateY(-1px);
            box-shadow: 0 10px 20px rgba(37, 99, 235, 0.3);
        }

        .flash-msg-admin {
            padding: 0.85rem 1rem;
            border-radius: 10px;
            margin-bottom: 1.25rem;
            font-size: 0.85rem;
            font-weight: 600;
            text-align: center;
        }
        .flash-error {
            background: rgba(220, 38, 38, 0.2);
            color: #FCA5A5;
            border: 1px solid rgba(220, 38, 38, 0.4);
        }
        .flash-success {
            background: rgba(22, 101, 52, 0.2);
            color: #86EFAC;
            border: 1px solid rgba(22, 101, 52, 0.4);
        }

        .back-link {
            text-align: center;
            margin-top: 1.5rem;
        }
        .back-link a {
            color: #64748B;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 600;
            transition: color 0.2s;
        }
        .back-link a:hover {
            color: #94A3B8;
        }
    </style>
</head>
<body>

    <div class="admin-login-card">
        <div class="admin-brand-header">
            <div class="admin-icon-shield">🛡️</div>
            <h1>Admin Control Portal</h1>
            <p>Authorized Admin Access Only</p>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="flash-msg-admin {% if category == 'error' %}flash-error{% else %}flash-success{% endif %}">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form action="{{ url_for('admin_login') }}" method="POST">
            <div class="form-group-admin">
                <label for="email">Admin Email Address</label>
                <input type="email" id="email" name="email" class="form-input-admin" placeholder="pranaykrsingh03@gmail.com" required value="pranaykrsingh03@gmail.com">
            </div>

            <div class="form-group-admin">
                <label for="password">Admin Password</label>
                <input type="password" id="password" name="password" class="form-input-admin" placeholder="••••••••" required autofocus>
            </div>

            <button type="submit" class="btn-admin-submit">
                🔐 Authenticate & Log In
            </button>
        </form>

        <div class="back-link">
            <a href="{{ url_for('dashboard') }}">← Back to Voyage Main Site</a>
        </div>
    </div>

</body>
</html>
